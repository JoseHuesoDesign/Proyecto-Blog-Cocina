<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Sugerir Receta</title>
        <link rel="stylesheet" href="css/styles.css">
    </head> 

    <body>
        <header>
            <h1>Sugerir Receta</h1>
        </header>

        <nav class="migas-pan">
            <a href="index.html">Rincón Culinario</a> &gt <span>Sugerir Receta</span>
        </nav>

        <form class="form">
            <label for="cheff_name">Nombre del Cheff</label>
            <input type="text" id="cheff_name" name="name" required>

            <label for="receta_name">Nombre de la Receta</label>
            <input type="text" id="receta_name" name="receta" required>

            <label for="ingredientes">Explcia aqui la receta:</label>
            <textarea class="area" id="ingredientes" name="elaboracion" rows="6" required></textarea>

            <button type="submit">Enviar</button>
        </form>
